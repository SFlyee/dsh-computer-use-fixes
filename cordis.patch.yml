# dsh-computer-use-fixes bundle patch：把插件插入 profile。
#
# 作为 dsh.bundle.patch 被 dsh 加载器消费。insert 引用本包（dsh-computer-use-fixes），
# 加载器会从 profile 的 node_modules 解析它并加载为 Cordis 插件。
- insert:
    - id: dsh-computer-use-fixes
      name: dsh-computer-use-fixes
      config:
        ttlMs: 30000
        maxElements: 500
